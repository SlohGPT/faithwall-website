<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Site-wide defaults. Per-page title/description/canonical/og:url/og:title/og:description are set via react-helmet-async on every page. -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- Open Graph / Twitter site defaults -->
  <meta property="og:site_name" content="FaithWall" />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicon & Icons -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icon-app-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0A0A0F" />

  <!-- Apple Smart App Banner -->
  <meta name="apple-itunes-app" content="app-id=6756815070, affiliate-data=pt=128303795&amp;ct=web-smart-banner&amp;mt=8" />

  <!-- Preload critical assets -->
  <link rel="preload" as="font" href="/fonts/dm-sans-latin.woff2" type="font/woff2" crossorigin />

  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "FaithWall",
    "url": "https://faithwall.app",
    "logo": "https://faithwall.app/icon-app-512.png",
    "sameAs": [
      "https://www.karchi.xyz/"
    ],
    "founder": {
      "@type": "Person",
      "name": "Karol Billik",
      "url": "https://faithwall.app/about/karol-billik"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "email": "hello@faithwall.app",
      "contactType": "customer support"
    }
  }
  </script>

  <!-- Structured Data: WebSite (enables sitelinks search) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "FaithWall",
    "alternateName": ["Faith Wall"],
    "url": "https://faithwall.app/"
  }
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
